<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Notice Board</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header class="header">
            <div class="logo">
                <i class="fas fa-clipboard-list"></i>
                <h1>Digital Notice Board</h1>
            </div>
            <div class="auth-section" id="authSection">
                <button class="btn btn-login" id="loginBtn">
                    <i class="fas fa-sign-in-alt"></i> Admin Login
                </button>
            </div>
        </header>

        <!-- Admin Panel (Hidden by default) -->
        <div class="admin-panel" id="adminPanel" style="display: none;">
            <h2><i class="fas fa-plus-circle"></i> Post New Notice</h2>
            <form id="noticeForm">
                <div class="form-group">
                    <label for="noticeTitle">Title</label>
                    <input type="text" id="noticeTitle" placeholder="Enter notice title" required>
                </div>
                <div class="form-group">
                    <label for="noticeCategory">Category</label>
                    <select id="noticeCategory">
                        <option value="general">General</option>
                        <option value="exam">Examination</option>
                        <option value="event">Event</option>
                        <option value="urgent">Urgent</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="noticeContent">Content</label>
                    <textarea id="noticeContent" rows="4" placeholder="Enter notice content" required></textarea>
                </div>
                <button type="submit" class="btn btn-post">
                    <i class="fas fa-paper-plane"></i> Post Notice
                </button>
            </form>
        </div>

        <!-- Filter Section -->
        <div class="filter-section">
            <button class="filter-btn active" data-filter="all">All</button>
            <button class="filter-btn" data-filter="general">General</button>
            <button class="filter-btn" data-filter="exam">Examination</button>
            <button class="filter-btn" data-filter="event">Event</button>
            <button class="filter-btn" data-filter="urgent">Urgent</button>
        </div>

        <!-- Notices Container -->
        <div class="notices-container" id="noticesContainer">
            <div class="loading" id="loading">
                <i class="fas fa-spinner fa-spin"></i> Loading notices...
            </div>
        </div>
    </div>

    <!-- Login Modal -->
    <div class="modal" id="loginModal">
        <div class="modal-content">
            <span class="close-modal" id="closeModal">&times;</span>
            <h2><i class="fas fa-lock"></i> Admin Login</h2>
            <form id="loginForm">
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" placeholder="Enter admin email" required>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" placeholder="Enter password" required>
                </div>
                <button type="submit" class="btn btn-login-submit">
                    <i class="fas fa-sign-in-alt"></i> Login
                </button>
            </form>
            <p class="error-message" id="errorMessage"></p>
        </div>
    </div>

    <!-- Toast Notification -->
    <div class="toast" id="toast"></div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    
    <script src="js/firebase-config.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
